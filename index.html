<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر الاحترافي</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
background:linear-gradient(90deg,#2563eb,#7c3aed);
padding:20px;
text-align:center;
font-weight:bold;
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#1f2937;
border-radius:12px;
text-align:center;
overflow:hidden;
}

.card img{
width:100%;
height:110px;
object-fit:cover;
}

.card p{
margin:8px 0;
font-weight:bold;
}

.btn{
display:block;
margin:8px;
padding:8px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:8px;
}
</style>
</head>

<body>

<header>🔥 متجر الهاشمي للتطبيقات</header>

<div class="grid">

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Likee">
<p>Likee</p>
<a class="btn" href="#">تحميل</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200?text=PartyStar">
<p>PartyStar</p>
<a class="btn" href="#">تحميل</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Game">
<p>لعبة الأكشن</p>
<a class="btn" href="#">تحميل</a>
</div>

</div>

</body>
</html>
